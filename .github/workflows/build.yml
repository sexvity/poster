name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name "YTK-SHORTS" --icon ytk.ico --add-data "ytk.ico;." --collect-all customtkinter --collect-submodules PIL --collect-all imageio_ffmpeg --collect-data googleapiclient --collect-data tzdata app.py
      - uses: actions/upload-artifact@v4
        with:
          name: YTK-SHORTS
          path: dist/YTK-SHORTS.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YTK-SHORTS.exe
